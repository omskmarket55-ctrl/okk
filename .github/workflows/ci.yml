name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: okk
          POSTGRES_PASSWORD: okk
          POSTGRES_DB: okk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U okk" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://okk:okk@localhost:5432/okk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
